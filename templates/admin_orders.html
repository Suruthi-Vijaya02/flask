<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Store Admin</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #0f1111;
            --muted-text: #565959;
            --price-color: #b12704;
            --border-color: #e7e7e7;
            --primary-color: #007185;
            --primary-hover: #005f70;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Top Navigation Bar */
        nav.navbar-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 1rem 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .nav-brand {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: background-color 0.2s;
        }

        .nav-links a:hover {
            background-color: var(--primary-hover);
        }

        .page-header {
            margin-bottom: 1.5rem;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* Orders Grid Container */
        .order-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .order-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .order-id {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .order-body {
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .customer-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .order-total {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--price-color);
        }

        .badge-status {
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-paid {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .badge-pending {
            background-color: #fff3cd;
            color: #664d03;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--muted-text);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar-custom">
        <a href="{{ url_for('admin_dashboard') }}" class="nav-brand">
            <i class="bi bi-shop"></i> Store Admin
        </a>
        <div class="nav-links">
            <a href="{{ url_for('admin_dashboard') }}">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="{{ url_for('admin.admin_products') }}">
                <i class="bi bi-box-seam"></i> Products
            </a>
            <a href="{{ url_for('admin.customers') }}">
                <i class="bi bi-people"></i> Users
            </a>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <h1>Customer Orders</h1>
    </div>

    <!-- Orders Grid -->
    <div class="order-grid">
        {% for order in orders %}
        <div class="order-card">
            <div>
                <div class="order-header">
                    <span class="order-id">Order #{{ order["order_id"] }}</span>
                    <span class="badge-status {% if order['payment_status'] == 'paid' %}badge-paid{% else %}badge-pending{% endif %}">
                        {{ order["payment_status"] }}
                    </span>
                </div>
                <div class="order-body">
                    <div class="customer-name"><i class="bi bi-person me-1"></i> {{ order["user_name"] }}</div>
                </div>
            </div>
            <div>
                <div class="order-total">₹{{ order["total_amount"] }}</div>
            </div>
        </div>
        {% else %}
        <div class="empty-state">
            <i class="bi bi-receipt fs-1 d-block mb-3"></i>
            <h4>No orders found</h4>
            <p>Customer purchases will appear here once orders are placed.</p>
        </div>
        {% endfor %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
