<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forgot password</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0 !important;
            margin-bottom: 24px !important;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(231, 195, 195, 0.2);
            color: #e7c3c3;
            text-align: center;
            font-weight: bold;
        }

        #forgot-password {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            width: 320px;
            box-sizing: border-box;
        }

        #forgot-password label {
            text-align: left;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #e7c3c3;
            font-weight: 500;
        }

        #forgot-password input {
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        #forgot-password input:focus {
            border-color: #e7c3c3;
            box-shadow: 0 0 8px rgba(231, 195, 195, 0.4);
            background: rgba(255, 255, 255, 0.12);
        }

        #forgot-password button[type="submit"] {
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #e7c3c3;
            color: #1e1e2f;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        #forgot-password button[type="submit"]:hover {
            background: #f0d4d4;
            transform: translateY(-1px);
        }

        #forgot-password button[type="submit"]:active {
            transform: translateY(0);
        }

        p {
            margin-top: 16px;
            font-size: 0.95rem;
            color: #ffffff;
            text-align: center;
        }

        p a {
            color: #e7c3c3;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        p a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Forgot Password</h1>
    <form id="forgot-password">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <button type="submit">Submit</button>
    </form>
    <p>Don't have an account? <a href="register.html">Register</a></p>
    <p id="message">hi</p>
    <script>
        const form=document.getElementById("forgot-password");
        const email=document.getElementById("email");
        const message=document.getElementById("message");
        form.addEventListener("submit",async function(e){
            e.preventDefault();
            const emailval=email.value;
            const response=await fetch("/forgot-password",{
                method:"POST",
                headers:{"content-type":"application/json"},
                body:JSON.stringify({
                    email:emailval
                })                
            })

            const data = await response.json();
            message.textContent=data.message;
            if(response.ok){
                alert(data.message);
                window.location.href="/verify";
            }
        });
    </script>
</body>
</html>
