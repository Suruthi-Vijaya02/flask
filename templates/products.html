<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>products</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #0f1111;
            --muted-text: #565959;
            --price-color: #b12704;
            --border-color: #e7e7e7;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        button{
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            background-color: #007185;
            color: #ffffff;
            cursor: pointer;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border-color);
        }

        /* Wrap products into a responsive 3-4 column grid */
        .products-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 items per row */
            gap: 1.25rem;
            width: 100%;
        }

        /* Responsive breakpoints for smaller screens */
        @media (max-width: 1200px) {
            .products-container {
                grid-template-columns: repeat(3, 1fr); /* 3 items per row on medium screens */
            }
        }

        @media (max-width: 768px) {
            .products-container {
                grid-template-columns: repeat(2, 1fr); /* 2 items on tablets */
            }
        }

        @media (max-width: 480px) {
            .products-container {
                grid-template-columns: 1fr; /* 1 item on mobile */
            }
        }

        /* Hide raw horizontal rules */
        hr {
            display: none;
        }

        /* Product Card Styling */
        div.product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        div.product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        /* Product Image */
        div.product-card img {
            width: 100% !important;
            height: 180px;
            object-fit: contain;
            margin-bottom: 1rem;
            border-radius: 4px;
        }

        /* Product Name */
        div.product-card h2 {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.5rem;
            color: #007185;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Description */
        div.product-card p:nth-of-type(1) {
            font-size: 0.85rem;
            color: var(--muted-text);
            line-height: 1.4;
            margin-bottom: 0.75rem;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Price */
        div.product-card p:nth-of-type(2) {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--price-color);
            margin-top: auto;
        }
    </style>
</head>
<body>
    <nav>
                <h1>Our Products</h1>
                 <!-- Floating Notification Toast -->
<div id="toast" class="toast"></div>
        <button><a href="/add_product">Add Product</a></button>
        <button><a href="/cart">Cart:{{cart_count}}</p></a></button>

    </nav>

    
    <div class="products-container">
    {% for product in products %}
        <div class="product-card">
            <img
                src="{{ url_for('static', filename=product.image) }}"
                alt="{{ product.prod_name }}"
                width="200"
            >
            <h2>{{ product.prod_name }}</h2>
            <p>{{ product.des }}</p>
            <p>Price: ₹{{ product.price }}</p>
        <button
    type="button"
    class="add-to-cart"
    data-product-id="{{ product.prod_id }}">
    Add to Cart
</button>

        </div>
        <hr>
    {% else %}
        <p>No products available.</p>
    {% endfor %}
           
    </div>
    <script>
       const toast = document.getElementById("toast");
        document.querySelectorAll(".add-to-cart").forEach(button => {

    button.addEventListener("click", async () => {

        const prodId = Number(button.dataset.productId);

        const response = await fetch("/cart", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                prod_id: prodId,
                quantity: 1
            })
        });

        const data = await response.json();
        
        if (!response.ok) {
            alert(data.message);
            return;
        }

        toast.textContent = "Product added to cart successfully!";
        toast.classList.add("show");
        setTimeout(() => {
            toast.classList.remove("show");
        }, 300);

    });

});

        
    </script>
</body>
</html>
