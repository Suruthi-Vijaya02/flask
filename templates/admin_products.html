<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Store Admin</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #0f1111;
            --muted-text: #565959;
            --price-color: #b12704;
            --border-color: #e7e7e7;
            --primary-color: #007185;
            --primary-hover: #005f70;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Top Navigation Bar */
        nav.navbar-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 1rem 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .nav-brand {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: background-color 0.2s;
        }

        .nav-links a:hover {
            background-color: var(--primary-hover);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* Product Cards Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-card p {
            color: var(--muted-text);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--price-color);
            margin-bottom: 1rem;
        }

        .product-actions {
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar-custom">
        <a href="{{ url_for('admin_dashboard') }}" class="nav-brand">
            <i class="bi bi-shop"></i> Store Admin
        </a>
        <div class="nav-links">
            <a href="{{ url_for('add_product') }}">
                <i class="bi bi-plus-circle"></i> Add Product
            </a>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <h1>Manage Products</h1>
    </div>

    <!-- Products Grid -->
    <div class="product-grid">
        {% for product in products %}
        <div class="product-card">
            <div>
                <h3>{{ product["prod_name"] }}</h3>
                <p>{{ product["des"] }}</p>
            </div>
            <div>
                <div class="product-price">₹{{ product["price"] }}</div>
                <div class="product-actions">
                    <button class="btn btn-outline-primary btn-sm w-100" 
                        onclick="editProduct('{{ product.prod_id }}', '{{ product.prod_name }}', '{{ product.des }}', '{{ product.price }}', '{{ product.image }}')">
                        <i class="bi bi-pencil"></i> Edit
                    </button>
                    <button class="btn btn-outline-danger btn-sm w-100" 
                        onclick="deleteProduct('{{ product.prod_id }}')">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Clean inline message banner instead of alert popups
        function showMessage(message, isError = false) {
            let msgBox = document.getElementById("status-message");
            if (!msgBox) {
                msgBox = document.createElement("div");
                msgBox.id = "status-message";
                msgBox.style.cssText = "margin-bottom: 1.5rem; padding: 0.75rem 1rem; border-radius: 6px; font-weight: 500; font-size: 0.9rem;";
                document.querySelector(".page-header").after(msgBox);
            }
            msgBox.style.backgroundColor = isError ? "#f8d7da" : "#d1e7dd";
            msgBox.style.color = isError ? "#842029" : "#0f5132";
            msgBox.style.border = isError ? "1px solid #f5c2c7" : "1px solid #badbcc";
            msgBox.innerText = message;
            
            setTimeout(() => { msgBox.style.display = "none"; }, 4000);
        }

        // Delete Product Function with correct blueprint /api/admin prefix
        async function deleteProduct(prodId) {
            if (!confirm("Are you sure you want to delete this product?")) return;

            try {
                const response = await fetch(`/api/admin/admin/product/delete/${prodId}`, {
                    method: "DELETE"
                });
                const data = await response.json();
                
                if (response.ok) {
                    showMessage(data.message, false);
                    setTimeout(() => window.location.reload(), 1000);
                } else {
                    showMessage(data.message || "Failed to delete product", true);
                }
            } catch (error) {
                console.error("Error:", error);
                showMessage("An error occurred while deleting.", true);
            }
        }

        // Edit Product Function with correct blueprint /api/admin prefix
        async function editProduct(prodId, currentName, currentDes, currentPrice, currentImage) {
            const newName = window.prompt("Edit Product Name:", currentName);
            if (newName === null) return;

            const newDes = window.prompt("Edit Description:", currentDes);
            if (newDes === null) return;

            const newPrice = window.prompt("Edit Price (₹):", currentPrice);
            if (newPrice === null) return;

            const newImage = window.prompt("Edit Image Filename:", currentImage);
            if (newImage === null) return;

            try {
                const response = await fetch(`/api/admin/admin/product/edit/${prodId}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        prod_name: newName,
                        des: newDes,
                        price: parseFloat(newPrice),
                        image: newImage
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    showMessage(data.message, false);
                    setTimeout(() => window.location.reload(), 1000);
                } else {
                    showMessage(data.message || "Failed to update product", true);
                }
            } catch (error) {
                console.error("Error:", error);
                showMessage("An error occurred while updating.", true);
            }
        }
    </script>
</body>
</html>
