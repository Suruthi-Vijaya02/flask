<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px 15px;
        }

        .checkout {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            text-align: right;
            font-size: 21px;
            font-weight: bold;
            margin: 25px 0;
        }

        .payment-options {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .payment-options label {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }

        .payment-options label:hover {
            background: #e9ecef;
            border-color: #005f6b;
        }

        .payment-options input[type="radio"] {
            accent-color: #005f6b;
            transform: scale(1.2);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #ffc107; /* Yellow theme for main action */
            color: #212529;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #ffca2c;
        }

        button:disabled {
            background: #999;
            color: white;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #005f6b;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="checkout">
        <h1>Checkout</h1>

        <h3>Order Summary</h3>

        {% for item in cart_items %}
            <div class="item">
                <strong>{{ item.prod_name }}</strong>
                <p>
                    ₹{{ "%.2f"|format(item.price) }}
                    × {{ item.quantity }}
                    = ₹{{ "%.2f"|format(item.price * item.quantity) }}
                </p>
            </div>
        {% endfor %}

        <div class="total">
            Total: ₹{{ "%.2f"|format(total) }}
        </div>

        <h3>Select Payment Method</h3>
        <div class="payment-options">
            <label><input type="radio" name="payment_method" value="UPI" checked> UPI</label>
            <label><input type="radio" name="payment_method" value="PayPal"> PayPal</label>
            <label><input type="radio" name="payment_method" value="Google Pay"> Google Pay</label>
            <label><input type="radio" name="payment_method" value="COD"> Cash on Delivery (COD)</label>
            <label><input type="radio" name="payment_method" value="Dummy Payment"> Dummy Payment</label>
        </div>

        <button id="payButton" type="button">
            Proceed with Payment
        </button>

        <p id="message" role="status"></p>

        <a class="back" href="{{ url_for('view_cart') }}">
            Back to Cart
        </a>
    </div>

<script>
    const button = document.querySelector("#payButton");
    const message = document.querySelector("#message");

    button.addEventListener("click", async () => {
        // Get the selected payment method radio button value
        const selectedPayment = document.querySelector('input[name="payment_method"]:checked');
        const paymentMethod = selectedPayment ? selectedPayment.value : "Unknown";

        button.disabled = true;
        message.textContent = "Processing payment...";

        try {
            const response = await fetch("/checkout", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ payment_method: paymentMethod })
            });

            const data = await response.json();

            if (response.ok) {
                message.innerHTML = `
                    <h2>✓ Order Successful!</h2>
                    <p>Order ID: ${data.order_id}</p>
                    <p>Method: ${paymentMethod}</p>
                    <p>Total: ₹${Number(data.total).toFixed(2)}</p>
                    <p>Order summary sent to your email.</p>
                `;

                button.style.display = "none";
            } else {
                message.textContent = data.message || "Checkout failed.";
                button.disabled = false;
            }
        } catch (error) {
            console.error(error);
            message.textContent = "Unable to process checkout.";
            button.disabled = false;
        }
    });
</script>
</body>
</html>
