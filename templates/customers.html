<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>users</title>
</head>
<body>
    <button><a href="/products">Back
    </a></button>
    <h1> active users</h1>
    <table>
        <tr>
            <th>id</th>
            <th>name</th>
            <th>email</th>
            <th>phone</th>
            <th>address</th>
        </tr>
        {% for user in users %} 
        <tr>
            <td>{{user["id"]}}</td>
            <td>{{user["name"]}}</td>
            <td>{{user["email"]}}</td>
            <td>{{user["phone"]}}</td>
            <td>{{user["address"]}}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
